plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Xander"
		url = "https://maven.isxander.dev/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chat-translator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	clientTest {
		java {
			srcDirs = ['src/client/test/java']
		}
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Chat Translator: ML inference stack
	// These are ordinary Maven libraries, not Fabric mods, so players won't have them
	// installed separately — include(...) bundles each as a nested jar inside our own
	// mod jar (Fabric Loom's "jar-in-jar"), which Fabric Loader extracts onto the
	// classpath at launch. Without this, `implementation`/`runtimeOnly` alone only
	// works in the dev environment (Gradle assembles the full classpath for
	// `runClient`) and throws NoClassDefFoundError in a real installed instance.
	implementation include("ai.djl:api:${project.djl_version}")
	runtimeOnly include("ai.djl.onnxruntime:onnxruntime-engine:${project.djl_version}")
	// include(...) does not pull in transitive dependencies of what it's given, so the
	// actual native ONNX Runtime binaries (a separate artifact from the thin DJL engine
	// wrapper above) must be included explicitly too, or inference fails at runtime
	// with UnsatisfiedLinkError despite the engine wrapper class loading fine.
	runtimeOnly include("com.microsoft.onnxruntime:onnxruntime:1.21.1")
	implementation include("ai.djl.huggingface:tokenizers:${project.djl_version}")
	implementation include("com.github.pemistahl:lingua:${project.lingua_version}")
	// Lingua is written in Kotlin and uses Moshi/Okio for its bundled language-model
	// JSON data — none of these are provided by Minecraft/Fabric's own dependencies
	// (unlike e.g. gson, jna, fastutil, commons-io, which the game already bundles and
	// don't need to be duplicated here), so they must be included explicitly too.
	implementation include("org.jetbrains.kotlin:kotlin-stdlib:1.6.21")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib-common:1.6.21")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.0")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.0")
	implementation include("org.jetbrains.kotlin:kotlin-reflect:1.6.0")
	implementation include("org.jetbrains:annotations:13.0")
	implementation include("com.squareup.moshi:moshi:1.13.0")
	implementation include("com.squareup.moshi:moshi-kotlin:1.13.0")
	implementation include("com.squareup.okio:okio:2.10.0")
	// Script → Latin romanization for outgoing chat on English-only servers
	implementation include("com.ibm.icu:icu4j:${project.icu4j_version}")

	// Optional Mod Menu config button (not required at runtime for players).
	// compileOnly so the jar does not hard-depend; localRuntime so runClient can open it.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// YACL is a hard runtime dependency (see fabric.mod.json); compileOnly + localRuntime for dev.
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	localRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	clientTestImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	clientTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('clientTest', Test) {
	description = 'Runs unit tests for pure client-side logic.'
	group = 'verification'
	testClassesDirs = sourceSets.clientTest.output.classesDirs
	classpath = sourceSets.clientTest.runtimeClasspath
	useJUnitPlatform()
	// Lingua's LanguageDetectorBuilder.fromAllLanguages() loads n-gram models for
	// every supported language; the default forked test JVM heap is too small for that.
	maxHeapSize = '2g'
}

tasks.named('check') {
	dependsOn 'clientTest'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
