# Builds the mod and publishes a GitHub Release whenever a v* tag is pushed.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag drives the jar version (-Pmod_version), so gradle.properties does not have
# to be edited for a release. Release notes come from the matching CHANGELOG.md
# section when one exists.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Both sources end up in a shell command and a file path below, so refuse
          # anything that is not a plain version string.
          case "$version" in
            *[!0-9.a-zA-Z-]*|'') echo "Bad version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Single source of truth for which Minecraft version this jar targets.
          echo "minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build -Pmod_version=${{ steps.version.outputs.version }}

      - name: extract release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          # Pull the "## [version]" block out of CHANGELOG.md, if it is there.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Lingo $version for Minecraft 26.1.2 (Fabric)." > release-notes.md
          fi

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Lingo ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            build/libs/chat-translator-${{ steps.version.outputs.version }}.jar

      # Uploads the same jar to CurseForge and Modrinth. Each platform is skipped
      # when its token secret is missing, so this stays green before the listings
      # exist and starts working the moment the secrets are added.
      #
      # MODRINTH_TOKEN expires 2026-11-01. Past that date this step fails with a
      # plain authorization error that never mentions expiry, which reads like a
      # wrong project id — regenerate the PAT (scopes: create versions, read
      # projects) and replace the secret. CurseForge tokens do not expire.
      - name: publish to curseforge and modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: build/libs/chat-translator-${{ steps.version.outputs.version }}.jar
          name: Lingo ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: release-notes.md

          loaders: fabric
          game-versions: ${{ steps.version.outputs.minecraft }}
          java: 25

          # Dependencies are read from fabric.mod.json, so YACL and Mod Menu stay
          # optional there and are published as optional here.
          dependencies: |
            fabric-api(required)
            yet_another_config_lib_v3(optional)
            modmenu(optional)

          retry-attempts: 2
